<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>八つ折りZINEメーカー</title>
<meta name="description" content="A4・A3の紙1枚から8ページのミニブック（八つ折りZINE）を作るWebアプリ。写真と文字を自由にレイアウトして、面付け済みのPDFで保存できます。写真はサーバーに送られず、ブラウザの中だけで処理されます。">
<meta property="og:title" content="八つ折りZINEメーカー">
<meta property="og:description" content="紙1枚で8ページの本。写真と文字をレイアウトして、面付け済みPDFで印刷。">
<meta property="og:type" content="website">
<meta name="theme-color" content="#fffdf8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231c1a17'/%3E%3Cpath d='M14 18h36v28H14z' fill='%23f4f0e8'/%3E%3Cpath d='M32 18v28' stroke='%23ff4f2e' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Serif+JP:wght@400;700&family=Zen+Maru+Gothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;700&family=M+PLUS+Rounded+1c:wght@400;700&family=Kiwi+Maru&family=Klee+One:wght@400;600&family=Yomogi&family=Dela+Gothic+One&family=DotGothic16&family=Reggae+One&family=Shippori+Mincho:wght@400;700&family=RocknRoll+One&family=Hachi+Maru+Pop&family=Bebas+Neue&family=Caveat:wght@400;700&display=swap" rel="stylesheet">
<script src="vendor/jspdf.umd.min.js"></script>
<style>
:root{--paper:#f4f0e8;--ink:#1c1a17;--muted:#7a746a;--line:#d9d2c4;--accent:#ff4f2e;--panel:#fffdf8}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:"Zen Kaku Gothic New","Noto Sans JP",system-ui,sans-serif;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;overflow:hidden;font-size:14px}
header{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1.5px solid var(--ink);background:var(--panel);flex-wrap:wrap}
.logo{font-family:"Dela Gothic One","Noto Sans JP",sans-serif;font-size:19px;white-space:nowrap;margin-right:auto;display:flex;align-items:center;gap:6px}
.logo b{background:var(--ink);color:var(--paper);padding:1px 7px;font-weight:400}
.logo small{font-family:"Zen Kaku Gothic New";font-size:11px;color:var(--muted)}
main{flex:1;display:grid;grid-template-columns:150px minmax(0,1fr) 300px;min-height:0}
#pages{border-right:1.5px solid var(--ink);overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:12px;background:var(--panel)}
.thumb{cursor:pointer;text-align:center;font-size:12px;color:var(--muted);user-select:none}
.thumb canvas{width:100%;display:block;border:1px solid var(--line);background:#fff;box-shadow:2px 2px 0 rgba(28,26,23,.12);margin-bottom:4px}
.thumb.on{color:var(--ink);font-weight:700}
.thumb.on canvas{outline:3px solid var(--accent);outline-offset:1px}
.thumb:not(.wide) canvas{width:50%;margin-left:auto;margin-right:auto}
.gut{position:absolute;top:0;bottom:0;border-left:1.5px dashed rgba(28,26,23,.45)}
.plab{position:absolute;top:-22px;transform:translateX(-50%);font-size:11px;color:var(--muted);white-space:nowrap}
#center{display:flex;flex-direction:column;min-width:0;min-height:0}
.toolbar{display:flex;gap:8px;padding:9px 14px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.toolbar .sp{flex:1}
#stageArea{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;touch-action:none;background-image:radial-gradient(rgba(28,26,23,.13) 1px,transparent 1px);background-size:16px 16px}
#pageWrap{position:relative;flex:none}
#page{position:absolute;inset:0;overflow:hidden;outline:1.5px solid var(--ink);box-shadow:5px 5px 0 rgba(28,26,23,.18)}
.el{position:absolute;transform-origin:center center;cursor:move}
.el canvas{width:100%;height:100%;display:block;pointer-events:none}
.el.locked{cursor:default}
#guides{position:absolute;inset:0;pointer-events:none}
.mg{position:absolute;background:repeating-linear-gradient(45deg,rgba(255,79,46,.20) 0 3px,transparent 3px 7px)}
.snap{position:absolute;background:var(--accent);display:none}
#sel{position:absolute;pointer-events:none;outline:1.5px solid var(--accent);transform-origin:center center;display:none}
#sel [data-h]{position:absolute;width:14px;height:14px;background:#fff;border:2px solid var(--accent);border-radius:50%;pointer-events:auto;margin:-7px 0 0 -7px;touch-action:none}
#sel [data-h=nw]{left:0;top:0;cursor:nwse-resize}#sel [data-h=ne]{left:100%;top:0;cursor:nesw-resize}
#sel [data-h=sw]{left:0;top:100%;cursor:nesw-resize}#sel [data-h=se]{left:100%;top:100%;cursor:nwse-resize}
#sel [data-h=n]{left:50%;top:0;border-radius:3px;cursor:ns-resize}#sel [data-h=s]{left:50%;top:100%;border-radius:3px;cursor:ns-resize}
#sel [data-h=w]{left:0;top:50%;border-radius:3px;cursor:ew-resize}#sel [data-h=e]{left:100%;top:50%;border-radius:3px;cursor:ew-resize}
#sel [data-h=rot]{left:50%;top:-30px;background:var(--accent);cursor:grab}
#sel .stem{position:absolute;left:50%;top:-23px;height:23px;border-left:1.5px solid var(--accent)}
#crop{position:absolute;pointer-events:none;transform-origin:center center;display:none;outline:2px dashed var(--accent);outline-offset:0}
#crop img{position:absolute;opacity:.42;max-width:none;user-select:none}
#cropBar{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:10px;background:var(--ink);color:var(--paper);padding:7px 8px 7px 16px;border-radius:999px;font-size:12px;z-index:5;white-space:nowrap;box-shadow:3px 3px 0 rgba(0,0,0,.2)}
#cropBar input{width:110px;accent-color:var(--accent)}
#cropBar .btn{box-shadow:none;border-color:var(--paper)}
#stageArea.cropping .el{cursor:grab}
#stageArea.cropping.panning .el{cursor:grabbing}
#hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:12px;line-height:1.7;pointer-events:none;padding:10px}
#previewArea{position:absolute;inset:0;overflow:auto;padding:24px;display:none;touch-action:auto}
#previewArea .cap{font-size:12px;color:var(--muted);margin:10px 0 0;text-align:center}
.spreads{display:flex;flex-wrap:wrap;gap:22px;justify-content:center;align-items:flex-end}
.spread{text-align:center;font-size:12px;color:var(--muted)}
.spread .pp{display:flex;box-shadow:5px 5px 0 rgba(28,26,23,.18);outline:1.5px solid var(--ink);background:#fff}
.spread canvas{display:block}
.spread .pp canvas+canvas{border-left:1px solid var(--line)}
#props{border-left:1.5px solid var(--ink);overflow:auto;padding:14px 16px 30px;background:var(--panel)}
#props h3{font-family:"Dela Gothic One","Noto Sans JP";font-weight:400;font-size:15px;margin:4px 0 12px}
#props h4{font-size:12px;color:var(--muted);margin:16px 0 6px;font-weight:700;letter-spacing:.05em}
#props hr{border:0;border-top:1px dashed var(--line);margin:16px 0}
.row{display:flex;align-items:center;gap:8px;margin:7px 0}
.row>label{width:64px;flex:none;font-size:12px;color:var(--muted)}
.row>.grow{flex:1;min-width:0}
.rg{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.rg input{flex:1;min-width:0;accent-color:var(--accent)}
.rg output{font-size:11px;width:44px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.btn{font:inherit;border:1.5px solid var(--ink);background:#fff;color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer;font-size:13px;box-shadow:2px 2px 0 var(--ink);white-space:nowrap;line-height:1.2}
.btn:hover{background:#fff6ef}
.btn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:#ff3a17}
.btn.ghost{box-shadow:none;border-color:var(--line)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.danger{color:#c62a12;border-color:#c62a12;box-shadow:2px 2px 0 #c62a12}
.btn:disabled{opacity:.4;cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.tabs{display:flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
.tabs button{font:inherit;font-size:12px;border:0;background:#fff;padding:6px 12px;cursor:pointer;color:var(--ink)}
.tabs button+button{border-left:1.5px solid var(--ink)}
.tabs button.on{background:var(--ink);color:var(--paper)}
.seg{display:flex;flex:1;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.seg button{flex:1;font:inherit;font-size:12px;border:0;background:#fff;padding:5px 4px;cursor:pointer;color:var(--ink)}
.seg button+button{border-left:1px solid var(--ink)}
.seg button.on{background:var(--ink);color:var(--paper)}
select,textarea,input[type=number]{font:inherit;border:1.5px solid var(--ink);border-radius:8px;background:#fff;padding:5px 8px;color:var(--ink);width:100%}
textarea{resize:vertical;min-height:84px;line-height:1.5}
input[type=number]{width:64px;flex:none}
input[type=color]{width:38px;height:28px;border:1.5px solid var(--ink);border-radius:6px;padding:1px;background:#fff;cursor:pointer;flex:none}
.sw{display:flex;gap:5px;flex-wrap:wrap}
.sw button{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink);cursor:pointer;padding:0}
.note{font-size:11.5px;color:var(--muted);line-height:1.6;margin:6px 0}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;margin:8px 0}
.chk input{accent-color:var(--accent);width:16px;height:16px}
#modal{position:fixed;inset:0;background:rgba(28,26,23,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal .box{background:var(--panel);border:1.5px solid var(--ink);box-shadow:6px 6px 0 var(--ink);border-radius:14px;max-width:620px;width:100%;max-height:90vh;overflow:auto;padding:22px 24px}
#modal h2{font-family:"Dela Gothic One","Noto Sans JP";font-weight:400;font-size:18px;margin:0 0 12px}
#modal ol{padding-left:1.3em;line-height:1.8}
#modal li{margin-bottom:6px}
#modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
#busy{position:fixed;inset:0;background:rgba(244,240,232,.7);display:none;align-items:center;justify-content:center;z-index:60;font-weight:700}
#busy span{background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;transition:.25s;z-index:70;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
.hide{display:none!important}
@media (max-width:880px){
  body{overflow:auto;height:auto;min-height:100%}
  main{grid-template-columns:1fr;grid-template-rows:auto auto auto}
  #pages{flex-direction:row;border-right:0;border-bottom:1.5px solid var(--ink);order:1;padding:10px}
  .thumb{width:90px;flex:none}
  #center{order:2;height:70vh}
  #props{order:3;border-left:0;border-top:1.5px solid var(--ink)}
  .logo small{display:none}
}
</style>
</head>
<body>
<header>
  <div class="logo"><b>八つ折り</b>ZINEメーカー <small>A4・A3一枚で8ページの本</small></div>
  <button class="btn ghost sm" id="bUndo" title="元に戻す (Ctrl+Z)">↶ 戻す</button>
  <button class="btn ghost sm" id="bRedo" title="やり直す (Ctrl+Shift+Z)">↷ やり直す</button>
  <button class="btn ghost sm" id="bHelp">折り方・印刷のしかた</button>
  <button class="btn ghost sm" id="bSaveProj" title="編集データ(.json)を保存">データ保存</button>
  <button class="btn ghost sm" id="bLoadProj" title="保存した.jsonを読み込む">データ読込</button>
  <button class="btn sm" id="bPng">PNG</button>
  <button class="btn primary" id="bPdf">PDFで保存</button>
</header>
<main>
  <aside id="pages"></aside>
  <section id="center">
    <div class="toolbar">
      <button class="btn sm" id="bAddImg">＋ 写真</button>
      <button class="btn sm" id="bAddText">＋ 文字</button>
      <button class="btn sm ghost" id="bBulk" title="複数の写真を選ぶと、今のページから1ページ1枚ずつ全面に配置します">写真をまとめて配置</button>
      <span class="sp"></span>
      <div class="tabs">
        <button data-view="edit" class="on">ページ編集</button>
        <button data-view="book">本のプレビュー</button>
        <button data-view="sheet">印刷イメージ</button>
      </div>
    </div>
    <div id="stageArea">
      <div id="pageWrap">
        <div id="page"></div>
        <div id="guides"><div class="snap" id="snapV" style="top:0;bottom:0;width:1px"></div><div class="snap" id="snapH" style="left:0;right:0;height:1px"></div></div>
        <div id="hint">写真をここにドラッグ＆ドロップ<br>または「＋ 写真」「＋ 文字」で追加</div>
        <div id="sel"><div class="stem"></div><div data-h="rot" title="回転"></div><div data-h="nw"></div><div data-h="n"></div><div data-h="ne"></div><div data-h="e"></div><div data-h="se"></div><div data-h="s"></div><div data-h="sw"></div><div data-h="w"></div></div>
        <div id="crop"><img alt=""></div>
      </div>
      <div id="cropBar"><b>写真の位置を調整中</b><span id="cropHint"></span><span>拡大</span><input type="range" id="cropZoom" min="1" max="4" step="0.01"><button class="btn sm primary" id="cropDone">完了</button></div>
      <div id="previewArea"></div>
    </div>
  </section>
  <aside id="props"></aside>
</main>
<input type="file" id="fImg" accept="image/*" multiple class="hide">
<input type="file" id="fBulk" accept="image/*" multiple class="hide">
<input type="file" id="fReplace" accept="image/*" class="hide">
<input type="file" id="fProj" accept=".json,application/json" class="hide">
<div id="modal"><div class="box" id="modalBox"></div></div>
<div id="busy"><span id="busyText">作成中…</span></div>
<div id="toast"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const PAPER = { A4: { w: 297, h: 210 }, A3: { w: 420, h: 297 } };
const LABELS = ['表紙', 'P2', 'P3', 'P4', 'P5', 'P6', 'P7', '裏表紙'];
const FONTS = [
  ['Noto Sans JP', 'ゴシック'], ['Noto Serif JP', '明朝'], ['Zen Kaku Gothic New', '角ゴシック'],
  ['Zen Maru Gothic', '丸ゴシック'], ['M PLUS Rounded 1c', 'まるもじ'], ['Kiwi Maru', 'キウイ丸'],
  ['Klee One', 'クレー（えんぴつ風）'], ['Yomogi', 'よもぎ（手書き）'], ['Hachi Maru Pop', 'はちまるポップ'],
  ['Shippori Mincho', 'しっぽり明朝'], ['Dela Gothic One', 'デラゴシック（極太）'], ['RocknRoll One', 'ロックンロール'],
  ['Reggae One', 'レゲエ'], ['DotGothic16', 'ドット'], ['Bebas Neue', 'Bebas Neue（英字）'], ['Caveat', 'Caveat（英字手書き）']
];
const MM_PER_PT = 0.3528;
const MARGIN = 5; // 家庭用プリンタの印刷できない余白の目安(mm)

const DL = (async () => {
  try { return (window.claude && window.claude.use) ? await window.claude.use('downloads') : null; }
  catch (e) { return null; }
})();

function defaultState() {
  return { paper: 'A4', binding: 'left', pageNum: false, guides: 'marks', showMargin: true, cur: 0,
    pages: Array.from({ length: 8 }, () => ({ bg: '#ffffff' })),
    units: Array.from({ length: 5 }, () => ({ els: [] })) };
}
let state = defaultState();
const imgStore = {};
let sel = null, view = 'edit', S = 3;

const dims = () => { const p = PAPER[state.paper]; return { W: p.w, H: p.h, pw: p.w / 4, ph: p.h / 2 }; };
const uid = () => Math.random().toString(36).slice(2, 10);
const UNITS = [[0], [1, 2], [3, 4], [5, 6], [7]];
const ULABELS = ['表紙', '見開き P2–P3', '見開き P4–P5', '見開き P6–P7', '裏表紙'];
const USHORT = ['表紙', 'P2–3', 'P4–5', 'P6–7', '裏表紙'];
const unitLR = u => UNITS[u].length === 1 || state.binding === 'left' ? UNITS[u] : [...UNITS[u]].reverse();
const unitOf = i => { const u = UNITS.findIndex(a => a.includes(i)); return { u, side: unitLR(u).indexOf(i) }; };
const unitW = (u = state.cur) => UNITS[u].length * dims().pw;
const isSpread = (u = state.cur) => UNITS[u].length === 2;
const page = () => state.units[state.cur];
const findEl = id => page().els.find(e => e.id === id);
const allEls = () => state.units.flatMap(x => x.els);
function slotOf(i) {
  const L = [[3, 1], [3, 0], [2, 0], [1, 0], [0, 0], [0, 1], [1, 1], [2, 1]];
  let [c, r] = L[i]; if (state.binding === 'right') c = 3 - c;
  return { col: c, row: r, rot: r === 0 };
}
function outerSides(i) {
  const { col, row } = slotOf(i); const s = { top: false, bottom: true, left: false, right: false };
  if (col === 0) { if (row === 0) s.right = true; else s.left = true; }
  if (col === 3) { if (row === 0) s.left = true; else s.right = true; }
  return s;
}

/* ---------- images ---------- */
function registerImage(id, src) {
  return new Promise(res => {
    const im = new Image();
    im.onload = () => { imgStore[id] = { src, el: im, w: im.naturalWidth, h: im.naturalHeight }; res(imgStore[id]); };
    im.onerror = () => res(null);
    im.src = src;
  });
}
async function fileToImage(file) {
  const url = URL.createObjectURL(file);
  try {
    const im = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const max = 2400; let w = im.naturalWidth, h = im.naturalHeight; const k = Math.min(1, max / Math.max(w, h));
    w = Math.round(w * k); h = Math.round(h * k);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').drawImage(im, 0, 0, w, h);
    const png = /png|gif|webp/.test(file.type);
    const src = c.toDataURL(png ? 'image/png' : 'image/jpeg', 0.9);
    const id = 'img_' + uid(); await registerImage(id, src); return id;
  } finally { URL.revokeObjectURL(url); }
}
const filtCache = new Map();
function sourceFor(id, filter) {
  const info = imgStore[id]; if (!filter || filter === 'none') return info.el;
  const key = id + '|' + filter; if (filtCache.has(key)) return filtCache.get(key);
  const c = document.createElement('canvas'); c.width = info.w; c.height = info.h;
  const x = c.getContext('2d'); x.drawImage(info.el, 0, 0);
  const d = x.getImageData(0, 0, c.width, c.height), p = d.data;
  const duo = { 'riso-pink': [255, 72, 176], 'riso-blue': [0, 120, 191], 'riso-green': [0, 169, 92] }[filter];
  for (let i = 0; i < p.length; i += 4) {
    let r = p[i], g = p[i + 1], b = p[i + 2]; const l = 0.299 * r + 0.587 * g + 0.114 * b;
    if (filter === 'gray') { r = g = b = l; }
    else if (filter === 'contrast') { r = g = b = (l - 128) * 1.7 + 128; }
    else if (filter === 'sepia') {
      const nr = .393 * r + .769 * g + .189 * b, ng = .349 * r + .686 * g + .168 * b, nb = .272 * r + .534 * g + .131 * b;
      r = r * .15 + nr * .85; g = g * .15 + ng * .85; b = b * .15 + nb * .85;
    } else if (filter === 'bright') {
      r = (l + (r - l) * 1.35) * 1.08; g = (l + (g - l) * 1.35) * 1.08; b = (l + (b - l) * 1.35) * 1.08;
    } else if (duo) {
      let t = ((l - 128) * 1.25 + 128) / 255; t = Math.max(0, Math.min(1, t));
      r = duo[0] + (255 - duo[0]) * t; g = duo[1] + (255 - duo[1]) * t; b = duo[2] + (255 - duo[2]) * t;
    }
    p[i] = r; p[i + 1] = g; p[i + 2] = b;
  }
  x.putImageData(d, 0, 0); filtCache.set(key, c); return c;
}

/* ---------- drawing ---------- */
function shapePath(ctx, el, W, H, inset = 0) {
  ctx.beginPath(); const x = inset, y = inset, w = Math.max(0, W - 2 * inset), h = Math.max(0, H - 2 * inset);
  if (el.shape === 'circle') ctx.ellipse(W / 2, H / 2, w / 2, h / 2, 0, 0, Math.PI * 2);
  else if (el.shape === 'round') {

  const { W, H, pw, ph } = dims(), dpr = Math.min(2, window.devicePixelRatio || 1);
  pa.innerHTML = '';
  if (view === 'sheet') {
    const avail = Math.min(pa.clientWidth - 48, (pa.clientHeight - 90) * W / H), s = Math.max(1, avail / W);
    const cv = renderSheet(s * dpr, 'preview'); cv.style.cssText = `width:${W * s}px;display:block;margin:0 auto;outline:1.5px solid var(--ink);box-shadow:5px 5px 0 rgba(28,26,23,.18)`;
    pa.appendChild(cv);
    const p = document.createElement('p'); p.className = 'cap';
    p.innerHTML = `${state.paper}横・1枚に面付けした状態です。赤い破線が切り込み線、灰色の破線が折り線。オレンジのラベルはプレビュー用で印刷されません。<br>実際に印刷される線：<b>${{ marks: '切り込み線＋目印', full: '折り線と切り込み線', none: 'なし' }[state.guides]}</b>`;
    pa.appendChild(p);
  } else {
    const wrap = document.createElement('div'); wrap.className = 'spreads';
    const ps = Math.max(0.6, Math.min((pa.clientWidth - 80) / (pw * 2) / 1.4, (pa.clientHeight - 100) / ph / 1.6, 3));
    const mk = (idxs, cap) => {
      const d = document.createElement('div'); d.className = 'spread'; const pp = document.createElement('div'); pp.className = 'pp';
      for (const i of idxs) { const c = pageCanvas(i, ps * dpr); c.style.width = pw * ps + 'px'; pp.appendChild(c); }
      d.appendChild(pp); const s = document.createElement('div'); s.style.marginTop = '8px'; s.textContent = cap; d.appendChild(s); wrap.appendChild(d);
    };
    const R = state.binding === 'right';
    mk([0], '表紙');
    for (const [a, b] of [[1, 2], [3, 4], [5, 6]]) mk(R ? [b, a] : [a, b], R ? `P${b + 1} ・ P${a + 1}` : `P${a + 1} ・ P${b + 1}`);
    mk([7], '裏表紙');
    pa.appendChild(wrap);
    const p = document.createElement('p'); p.className = 'cap'; p.textContent = R ? '右綴じ：右から左へめくる順に並んでいます。' : '左綴じ：左から右へめくる順に並んでいます。';
    pa.appendChild(p);
  }
}
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { if (cropMode) exitCrop(); view = b.dataset.view; if (view !== 'edit') sel = null; renderProps(); renderView(); });
function renderAll() { renderView(); renderProps(); scheduleThumbs(); }
window.addEventListener('resize', () => { clearTimeout(window._rz); window._rz = setTimeout(renderView, 120); });

/* ---------- history & persistence ---------- */
let hist = [], hi = -1;
const snapshot = () => JSON.stringify({ paper: state.paper, binding: state.binding, pageNum: state.pageNum, guides: state.guides, showMargin: state.showMargin, pages: state.pages, units: state.units });
function commit() {
  const s = snapshot(); if (hist[hi] === s) return;
  hist = hist.slice(0, hi + 1); hist.push(s); if (hist.length > 80) hist.shift(); hi = hist.length - 1;
  scheduleSave(); scheduleThumbs(); updUndo();
}
function restoreSnap(s) { Object.assign(state, JSON.parse(s)); if (sel && !findEl(sel)) sel = null; renderAll(); scheduleSave(); updUndo(); }
function undo() { if (hi > 0) { hi--; restoreSnap(hist[hi]); } }
function redo() { if (hi < hist.length - 1) { hi++; restoreSnap(hist[hi]); } }
function updUndo() { $('#bUndo').disabled = hi <= 0; $('#bRedo').disabled = hi >= hist.length - 1; }
$('#bUndo').onclick = undo; $('#bRedo').onclick = redo;

function projectData() {
  const used = {};
  for (const el of allEls()) if (el.type === 'image' && imgStore[el.image]) used[el.image] = imgStore[el.image].src;
  return { app: 'zine8', v: 2, state: JSON.parse(snapshot()), cur: state.cur, images: used };
}
async function loadProject(d) {
  if (!d || !d.state || !Array.isArray(d.state.pages)) throw new Error('形式が違います');
  for (const [id, src] of Object.entries(d.images || {})) if (!imgStore[id]) await registerImage(id, src);
  const st = JSON.parse(JSON.stringify(d.state));
  if (!st.units) { // v1（ページ単位）→ 見開き単位に変換
    const pw = PAPER[st.paper || 'A4'].w / 4, bind = st.binding || 'left';
    st.units = UNITS.map(us => {
      const LR = us.length === 1 || bind === 'left' ? us : [...us].reverse(); const els = [];
      LR.forEach((i, side) => (st.pages[i].els || []).forEach(el => { el.x += side * pw; els.push(el); }));
      return { els };
    });
    st.pages = st.pages.map(p => ({ bg: p.bg || '#ffffff' }));
    d.cur = UNITS.findIndex(a => a.includes(d.cur || 0));
  }
  state = Object.assign(defaultState(), st, { cur: Math.min(4, Math.max(0, d.cur || 0)) }); sel = null;
}
function idb() {
  return new Promise((res, rej) => { const r = indexedDB.open('zine8maker', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
}
async function idbSet(k, v) { const db = await idb(); return new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }
async function idbGet(k) { const db = await idb(); return new Promise((res, rej) => { const tx = db.transaction('kv', 'readonly'); const r = tx.objectStore('kv').get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
let saveT, saveWarned = false;
function scheduleSave() {
  clearTimeout(saveT);
  saveT = setTimeout(async () => {
    try { await idbSet('project', projectData()); saveWarned = false; }
    catch (e) { if (!saveWarned) { saveWarned = true; toast('ブラウザへの自動保存ができませんでした（容量不足など）。「データ保存」で書き出してください', 6000); } }
  }, 700);
}
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}

$('#bSaveProj').onclick = () => deliver('zine-data.json', JSON.stringify(projectData()));
$('#bLoadProj').onclick = () => $('#fProj').click();
$('#fProj').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try { showBusy('読み込み中…'); await loadProject(JSON.parse(await f.text())); hideBusy(); commit(); renderAll(); toast('読み込みました'); }
  catch (err) { hideBusy(); toast('読み込めませんでした：' + err.message); }
};

/* ---------- export ---------- */
async function exportFile(kind) {
  if (kind === 'pdf' && !(window.jspdf && window.jspdf.jsPDF)) { toast('PDFライブラリを読み込めませんでした。ページを再読み込みしてください'); return; }
  showBusy(kind === 'pdf' ? 'PDFを作成中…' : '画像を作成中…');
  try {
    await ensureAllFonts(); await new Promise(r => setTimeout(r, 40));
    const { W, H } = dims(), s = state.paper === 'A4' ? 10 : 8;
    const cv = renderSheet(s, state.guides);
    let data, name;
    if (kind === 'pdf') {
      const pdf = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'mm', format: state.paper.toLowerCase(), compress: true });
      pdf.addImage(cv.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, W, H, undefined, 'FAST');
      pdf.setProperties({ title: '八つ折りZINE' });
      data = pdf.output('blob'); name = `zine_${state.paper}.pdf`;
    } else { data = await new Promise(r => cv.toBlob(r, 'image/png')); name = `zine_${state.paper}.png`; }
    hideBusy(); await deliver(name, data);
  } catch (e) { hideBusy(); toast('作成に失敗しました：' + (e.message || e)); }
}
async function deliver(name, data) {
  const dl = await DL;
  if (dl) {
    try { await dl.save({ filename: name, data }); toast('保存しました。印刷は「実際のサイズ」で横向きに'); }
    catch (err) { if (err && err.code === 'declined') toast('キャンセルしました'); else if (err && err.code === 'rate_limited') toast('少し待ってからもう一度お試しください'); else fallbackDownload(name, data); }
  } else fallbackDownload(name, data);
}
function fallbackDownload(name, data) {
  try {
    const blob = data instanceof Blob ? data : new Blob([data], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    toast('ダウンロードを開始しました');
  } catch (e) { toast('ダウンロードできませんでした。別のブラウザでお試しください'); }
}
$('#bPdf').onclick = () => exportFile('pdf');
$('#bPng').onclick = () => exportFile('png');

/* ---------- toolbar ---------- */
$('#bAddImg').onclick = () => { if (view !== 'edit') { view = 'edit'; renderView(); } $('#fImg').click(); };
$('#bBulk').onclick = () => { if (view !== 'edit') { view = 'edit'; renderView(); } $('#fBulk').click(); };
$('#bAddText').onclick = () => { if (view !== 'edit') { view = 'edit'; renderView(); } addText(); };
$('#fImg').onchange = e => { const f = [...e.target.files]; e.target.value = ''; addImages(f, 'one'); };
$('#fBulk').onchange = e => { const f = [...e.target.files]; e.target.value = ''; addImages(f, 'spread'); };
$('#fReplace').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f || !replaceTarget) return;
  const el = findEl(replaceTarget); if (!el) return;
  try { showBusy('写真を読み込み中…'); el.image = await fileToImage(f); Object.assign(el, { zoom: 1, offX: 0, offY: 0 }); } catch (err) { toast('読み込めませんでした'); }
  hideBusy(); commit(); renderAll();
};

/* ---------- modal / toast ---------- */
function openModal(html) { $('#modalBox').innerHTML = html; $('#modal').style.display = 'flex'; }
function closeModal() { $('#modal').style.display = 'none'; }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal' || e.target.closest('[data-close]')) closeModal(); });
function confirmModal(title, msg, ok) {
  return new Promise(res => {
    openModal(`<h2>${title}</h2><p>${msg}</p><div class="foot"><button class="btn ghost" id="mNo">やめる</button><button class="btn primary" id="mOk">${ok}</button></div>`);
    $('#mNo').onclick = () => { closeModal(); res(false); }; $('#mOk').onclick = () => { closeModal(); res(true); };
  });
}
function layoutSVG() {
  let g = '';
  for (let i = 0; i < 8; i++) {
    const { col, row, rot } = slotOf(i), x = col * 100, y = row * 70, cov = i === 0 || i === 7;
    g += `<rect x="${x}" y="${y}" width="100" height="70" fill="${cov ? '#ffe3dc' : '#fff'}" stroke="#1c1a17" stroke-dasharray="3 3"/>`;
    g += `<text x="${x + 50}" y="${y + 40}" text-anchor="middle" font-size="14" font-weight="700" ${rot ? `transform="rotate(180 ${x + 50} ${y + 35})"` : ''}>${LABELS[i]}</text>`;
  }
  return `<svg viewBox="-4 -4 408 148" style="width:100%;max-width:480px;display:block;margin:6px auto 14px;font-family:'Zen Kaku Gothic New',sans-serif">${g}
    <rect x="0" y="0" width="400" height="140" fill="none" stroke="#1c1a17" stroke-width="2"/>
    <line x1="100" y1="70" x2="300" y2="70" stroke="#e62828" stroke-width="3.5"/>
    <text x="200" y="88" fill="#e62828" font-size="11" font-weight="700" text-anchor="middle">✂ ここだけ切る</text></svg>`;
}
$('#bHelp').onclick = () => openModal(`<h2>八つ折りの作り方</h2>
  <p class="note">紙1枚をこの配置で印刷します（上の段は上下逆さま。${state.binding === 'right' ? '右綴じ' : '左綴じ'}の配置）。</p>
  ${layoutSVG()}
  <ol>
    <li><b>印刷</b>：PDFを${state.paper}・<b>横向き</b>・片面で印刷。倍率は「実際のサイズ（100%）」がおすすめ。端が切れる場合は「用紙に合わせる」でもOK。</li>
    <li><b>折り目をつける</b>：印刷面を上に横長に置き、左右半分→さらに半分→さらに半分と折って、縦の折り目を3本つけます。広げて、上下半分にも折り目をつけます。</li>
    <li><b>切り込み</b>：左右半分に折った状態で、折り目（わ）の側から、横の折り目に沿って1マス分だけハサミで切ります。広げると真ん中に2マス分の切り込みができます。</li>
    <li><b>組み立て</b>：上下半分に折り（印刷面が外）、両端を持って中央に押し込みます。切り込みがひし形に開いて十字の形になります。</li>
    <li><b>完成</b>：表紙が一番上に来るように、ページをパタンとまとめれば8ページの本のできあがり！</li>
  </ol>
  <p class="note"><b>写真の扱い</b>：選んだ写真はサーバーに送信されず、お使いのブラウザの中だけで処理・保存されます。</p>
  <p class="note">ヒント：右上の「印刷イメージ」タブで、面付けした状態を確認できます。厚手の紙より、普通紙やコピー用紙のほうがきれいに折れます。</p>
  <div class="foot"><button class="btn primary" data-close>閉じる</button></div>`);
let toastT;
function toast(msg, ms = 2600) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms); }
function showBusy(t) { $('#busyText').textContent = t; $('#busy').style.display = 'flex'; }
function hideBusy() { $('#busy').style.display = 'none'; }

/* ---------- init ---------- */
// 同じブラウザの別タブで編集されたときに知らせる（最後に保存したタブの内容が残るため）
let bc = null; const tabId = uid();
try { bc = new BroadcastChannel('zine8maker'); bc.onmessage = e => { if (e.data && e.data.from !== tabId) toast('別のタブでも編集されています。同時に編集すると、後から保存した内容で上書きされます', 6000); }; } catch (e) {}
const _sched = scheduleSave; let bcT;
scheduleSave = () => { _sched(); clearTimeout(bcT); bcT = setTimeout(() => { try { bc && bc.postMessage({ from: tabId }); } catch (e) {} }, 800); };
(async function init() {
  buildPagesList();
  try { const d = await idbGet('project'); if (d) await loadProject(d); } catch (e) {}
  commit(); renderAll();
  if (document.fonts) document.fonts.ready.then(() => { fontEpoch++; renderEditor(); scheduleThumbs(); });
})();
})();
</script>
